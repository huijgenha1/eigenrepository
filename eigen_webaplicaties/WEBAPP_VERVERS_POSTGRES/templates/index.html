<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
	   <style>
	   <title>Live PostgreSQL Data</title>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center space-between;
            padding: 60px;
        }
        .content {
            width: 80%;
        }
        .sidebar {
            width: 70%;
            background-color: #f4f4f4;
            padding: 40px;
            border-left: 40px solid #ccc;
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        table {
            width: 25%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF99;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Live Data uit PostgreSQL</h1>
    <div id="data">Laden...</div>

    <script>
        function fetchData() {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    let table = "<table border='1'><tr><th>ID</th><th>Gegevens</th></tr>";
                    data.forEach(row => {
                        table += `<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`;
                    });
                    table += "</table>";
                    document.getElementById("data").innerHTML = table;
                })
                .catch(error => console.error('Fout bij ophalen van data:', error));
        }

        // Elke 3 seconden opnieuw laden
        setInterval(fetchData, 3000);

        // Laad de data meteen bij het openen
        window.onload = fetchData;
    </script>
</body>

<body>
    <h2>Voer uw gegevens in</h2>
    <form action="/submit" method="post">
        <label for="naam">Naam:</label>
        <input type="text" id="naam" name="naam" required>
        <br><br>
        <label for="adres">Adres:</label>
        <input type="text" id="adres" name="adres" required>
        <br><br>
        <button type="submit">Opslaan</button>
    </form>
</body>
