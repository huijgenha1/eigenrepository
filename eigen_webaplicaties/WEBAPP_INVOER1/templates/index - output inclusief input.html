<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoerformulier</title>
</head>
<body>
    <h2>Voer uw gegevens in</h2>
    <form action="/submit" method="post">
        <label for="naam">Naam:</label>
        <input type="text" id="naam" name="naam" required>
        <br><br>
        <label for="adres">Adres:</label>
        <input type="text" id="adres" name="adres" required>
        <br><br>
        <button type="submit">Opslaan</button>
    </form>
</body>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Data Weergave</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }
        .content {
            width: 60%;
        }
        .sidebar {
            width: 35%;
            background-color: #f4f4f4;
            padding: 10px;
            border-left: 2px solid #ccc;
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="content">
        <h2>Welkom op de pagina</h2>
        <p>Resultaat gegevens uit PostgreSQL-database</p>
    </div>
    
    <div class="sidebar">
        <h2>INVOER tabel output</h2>
        <table>
            <tr>
                <th>Naam_output</th>
                <th>Adres_output</th>
            </tr>
            {% for naam, adres in data %}
            <tr>
                <td>{{ naam }}</td>
                <td>{{ adres }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>





</html>
